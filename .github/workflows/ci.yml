name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Verify the CLI runs
        run: node bin/mojibake.js --version

      - name: Confirm there are no dependencies to install
        run: node -e "const p=require('./package.json'); const d=Object.keys(p.dependencies||{}).length+(Object.keys(p.devDependencies||{}).length); if(d) { console.error('expected zero dependencies, found '+d); process.exit(1) } console.log('zero dependencies confirmed')"

      - name: Confirm the vendored codec tables match the WHATWG reference
        run: node scripts/gen-tables.js && git diff --exit-code src/tables.js

      - name: Run the test suite
        run: node --test
